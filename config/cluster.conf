[servers]
; Declaration order = priority order: first entry is the primary.
; All nodes walk this list top-to-bottom for failover.
server_primary  = 172.20.0.10:12345
server_standby1 = 172.20.0.13:12345
server_standby2 = 172.20.0.14:12345

[replication]
; Number of copies of each file (including the original).
replication_factor     = 2

; How often the primary sends LEADER_HB to standbys (ms).
heartbeat_interval_ms   = 2000

; How long a standby waits without a heartbeat before starting promotion (ms).
heartbeat_timeout_ms    = 8000

; How many times a standby probes higher-priority servers before promoting.
reconnect_attempts      = 3
reconnect_delay_ms      = 1000

; How many times the promoting standby tries to reach each higher-priority
; server before declaring it dead and claiming leadership.
promotion_probe_attempts = 3
promotion_probe_delay_ms = 500
