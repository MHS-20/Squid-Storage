services:
  server_primary: &server-base
    image: archlinux:latest
    environment: &server-env
      HOME: /root
      SQUID_STORAGE_ROOT: /root/SquidStorage
    volumes: &server-vols
      - ./mockfiles/server_primary:/root/SquidStorage
      - ./build:/app/bin:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
    working_dir: /root/SquidStorage
    entrypoint: ["/app/scripts/docker_entrypoint.sh"]
    # args: port  replicationFactor  timeoutSeconds  configPath  myName
    command: /app/bin/SquidStorageServer 12345 2 10 /app/config/cluster.conf server_primary
    ports:
      - "12345:12345"
    networks:
      squid_network:
        ipv4_address: 172.20.0.10

  server_standby1:
    <<: *server-base
    volumes:
      - ./mockfiles/server_standby1:/root/SquidStorage
      - ./build:/app/bin:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
    command: /app/bin/SquidStorageServer 12345 2 10 /app/config/cluster.conf server_standby1
    ports:
      - "12346:12345"
    depends_on:
      - server_primary
    networks:
      squid_network:
        ipv4_address: 172.20.0.13

  server_standby2:
    <<: *server-base
    volumes:
      - ./mockfiles/server_standby2:/root/SquidStorage
      - ./build:/app/bin:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
    command: /app/bin/SquidStorageServer 12345 2 10 /app/config/cluster.conf server_standby2
    ports:
      - "12347:12345"
    depends_on:
      - server_primary
    networks:
      squid_network:
        ipv4_address: 172.20.0.14

  datanode1: &datanode-base
    image: archlinux:latest
    environment:
      HOME: /root
      SQUID_STORAGE_ROOT: /root/SquidStorage
    volumes:
      - ./mockfiles/datanode_alpha:/root/SquidStorage
      - ./build:/app/bin:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
    working_dir: /root/SquidStorage
    entrypoint: ["/app/scripts/docker_entrypoint.sh"]
    # args: server_ip  server_port  identity  configPath
    command: /app/bin/DataNode 172.20.0.10 12345 DATANODE_ALPHA /app/config/cluster.conf
    depends_on:
      - server_primary
    networks:
      squid_network:
        ipv4_address: 172.20.0.11

  datanode2:
    <<: *datanode-base
    volumes:
      - ./mockfiles/datanode_beta:/root/SquidStorage
      - ./build:/app/bin:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
    command: /app/bin/DataNode 172.20.0.10 12345 DATANODE_BETA /app/config/cluster.conf
    depends_on:
      - server_primary
    networks:
      squid_network:
        ipv4_address: 172.20.0.12

  # mock_client:
  #   image: archlinux:latest
  #   environment:
  #     HOME: /root
  #     SQUID_STORAGE_ROOT: /root/SquidStorage
  #   volumes:
  #     - ./mockfiles/client:/root/SquidStorage
  #     - ./build:/app/bin:ro
  #     - ./config:/app/config:ro
  #   working_dir: /root/SquidStorage
  #   # arg: configPath  processName  (new config-path form added in client/src/main.cpp)
  #   command: /app/bin/SquidStorageClient /app/config/cluster.conf MOCK_CLIENT_CONTAINER
  #   depends_on:
  #     - datanode1
  #     - datanode2
  #   networks:
  #     squid_network:
  #       ipv4_address: 172.20.0.20
  #
  fuse_client:
    image: archlinux:latest
    environment:
      HOME: /root
      SQUID_STORAGE_ROOT: /root/SquidStorage
    volumes:
      - ./mockfiles/client:/root/SquidStorage
      - ./build:/app/bin:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    entrypoint: ["/app/scripts/docker_entrypoint.sh"]
    command: ["sh", "-c", "pacman -Sy --noconfirm fuse3 && mkdir -p /mnt/squid && exec /app/bin/SquidFSMount /mnt/squid /app/config/cluster.conf FUSE_CLIENT"]
    depends_on:
      - datanode1
      - datanode2
    networks:
      squid_network:
        ipv4_address: 172.20.0.21

  chaos:
    image: ghcr.io/alexei-led/pumba:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      --random --interval 30s
      kill --signal SIGKILL
      "re2:(server|datanode)_primary"

networks:
  squid_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
