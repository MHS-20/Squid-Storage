services:
  server:
    image: archlinux:latest
    environment:
      HOME: /root
      SQUID_STORAGE_ROOT: /root/SquidStorage
    volumes:
      - ./mockfiles/server:/root/SquidStorage
      - ./build:/app/bin:ro
    working_dir: /root/SquidStorage
    command: /app/bin/SquidStorageServer 12345 2 10
    ports:
      - "12345:12345"
    networks:
      squid_network:
        ipv4_address: 172.20.0.10

  datanode1:
    image: archlinux:latest
    environment:
      HOME: /root
      SQUID_STORAGE_ROOT: /root/SquidStorage
    volumes:
      - ./mockfiles/datanode_alpha:/root/SquidStorage
      - ./build:/app/bin:ro
    working_dir: /root/SquidStorage
    command: /app/bin/DataNode 172.20.0.10 12345 DATANODE_ALPHA
    depends_on:
      - server
    networks:
      squid_network:
        ipv4_address: 172.20.0.11

  datanode2:
    image: archlinux:latest
    environment:
      HOME: /root
      SQUID_STORAGE_ROOT: /root/SquidStorage
    volumes:
      - ./mockfiles/datanode_beta:/root/SquidStorage
      - ./build:/app/bin:ro
    working_dir: /root/SquidStorage
    command: /app/bin/DataNode 172.20.0.10 12345 DATANODE_BETA
    depends_on:
      - server
    networks:
      squid_network:
        ipv4_address: 172.20.0.12

  mock_client:
    image: archlinux:latest
    environment:
      HOME: /root
      SQUID_STORAGE_ROOT: /root/SquidStorage
    volumes:
      - ./mockfiles/client:/root/SquidStorage
      - ./build:/app/bin:ro
    working_dir: /root/SquidStorage
    command: /app/bin/SquidStorageClient 172.20.0.10 12345 MOCK_CLIENT_CONTAINER
    depends_on:
      - datanode1
      - datanode2
    networks:
      squid_network:
        ipv4_address: 172.20.0.20

networks:
  squid_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
